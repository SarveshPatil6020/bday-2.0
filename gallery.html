<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Gallery 📸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-fireflies"></div>
<span class="corner-bow tl">🎀</span>
<span class="corner-bow tr">🎀</span>

<div class="music-widget">
  <button class="music-toggle" id="musicToggle">🎀 Music</button>
  <div class="music-panel" id="musicPanel">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/0KSOLEBixnBYIKNHF1VbzF?utm_source=generator&si=7c2696704eb846c1
      width="100%" height="152" frameborder="0" allowfullscreen
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    <p class="music-hint">🎀 replace with your song — see README</p>
  </div>
</div>


<div class="page">
  <div class="eyebrow">tap a photo</div>
  <h1 class="display">A few of my favorites 🎀</h1>
  <div class="bow-divider">🎀</div>
  <p class="lead">Every one of these has a story. Click any photo to flip it over.</p>

  <div class="gallery-grid" id="galleryGrid">
    <!-- Cards are generated by JS below from the PHOTOS array -->
  </div>

  <a href="cake.html" class="btn" style="margin-top:40px;">Light the candles →</a>
</div>

<nav class="site-nav">
  <a href="index.html">Countdown</a>
  <a href="messages.html">Wishes</a>
  <a href="posters.html">Posters</a>
  <a href="letter.html">Letter</a>
  <a href="gallery.html">Gallery</a>
  <a href="cake.html">Cake</a>
</nav>

<script src="script.js"></script>
<script>
  guardPage();

  // ---- EDIT ME -------------------------------------------------------
  // Replace "img" with your real photos, e.g. "photos/1.jpg"
  // Replace "note" with your own little message for each one.
  const PHOTOS = [
    { img: "photos/1.jpeg", note: "Hayyee hayee, kya cutiee hath me lagi hai 😋" },
    { img: "photos/5.jpeg", note: "Smile toh dekho sweetiee ki koi bhi pighal jaye! 😩" },
    { img: "photos/6.jpeg", note: "Aise hi cheeku ko pyar karunga me 🥰" },
    { img: "photos/7.jpeg", note: "Bohot nakhrebaaz bhi ho aap...me hi utha sakta aapke nakhre so izzat se rehna😎" },
    { img: "photos/8.jpeg", note: "kya Zulfein hai...kya Adaa hai...kya mukhda hai.. " },
    { img: "photos/9.jpeg", note: "kitni hot bandi hai🫠 maal hai maal..cocain hai..perfect in every possible way💗" },
    { img: "photos/10.jpeg", note: "Bohot dramebaaz or bohot nautanki krte ho😼" },
    { img: "photos/11.jpeg", note: "kuch bhi kaho pyaare toh bohot ho..dil aajata hai hr bar" },
    { img: "photos/12.jpeg", note: "bss karo madam or dur raha nahi ja raha 😩" },
    { img: "photos/13.jpeg", note: "ghusse me aise hi laal cutu tamatar dikhte ho 🍅" },
  ];

  const grid = document.getElementById("galleryGrid");
  PHOTOS.forEach((p) => {
    const card = document.createElement("div");
    card.className = "flip-card";
    card.innerHTML = `
      <div class="flip-inner">
        <div class="flip-front"><img src="${p.img}" alt="Memory"></div>
        <div class="flip-back">${p.note}</div>
      </div>`;
    grid.appendChild(card);
  });

  initFlipCards();
</script>
</body>
</html>
